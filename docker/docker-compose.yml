version: "3.8"

services:
  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: school-books-bot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - bot-data:/app/data
    environment:
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  bot-data: