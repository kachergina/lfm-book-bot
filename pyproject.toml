[project]
name = "school-books-bot"
version = "0.1.0"
description = "Telegram bot for buying and selling school textbooks"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "School Books Bot Team", email = "team@schoolbooksbot.example"}
]
keywords = ["telegram", "bot", "marketplace", "books", "school"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiogram>=3.13.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.5",
    "structlog>=24.1.0",
    "aiofiles>=24.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "types-python-dateutil>=2.9.0",
    "pre-commit>=3.7.0",
]
prod = [
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "gunicorn>=22.0.0",
    "uvicorn>=0.30.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PIE", "PT", "Q",
    "ARG", "PTH", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "RET", "SLF", "TCH",
    "TID", "INP", "ISC", "ICN", "LOG", "G", "COM",
]
ignore = [
    "PLR2004",  # Magic values in comparisons (common in tests)
    "SLF001",   # Private member access (needed for testing internals)
    "PLC0415",  # Imports not at top-level (common in test fixtures)
    "TRY003",   # Long messages in exceptions (acceptable in this codebase)
    "PLW0603",  # Global statement (needed for module-level state)
    "PLR0913",  # Too many arguments (needed for complex functions)
    "PLR0917",  # Too many positional arguments (needed for complex functions)
    "PLR0912",  # Too many branches (acceptable for validation logic)
    "B904",     # Raise from (acceptable in this codebase)
    "COM812",   # Trailing commas (conflicts with formatter)
]
fixable = ["ALL"]
unfixable = []
extend-select = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"bot/import_catalog.py" = ["T201"]  # Allow print in CLI tool
"alembic/**" = ["INP001"]  # Alembic is not a package
"data/**" = ["INP001", "T201", "PLR0911", "SIM102", "SIM103", "PLW2901", "PLW0108", "RET504"]  # Data scripts
"tests/**" = ["ARG001", "ARG002", "F841"]  # Unused args/vars in tests

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
implicit_reexport = true
allow_untyped_globals = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=bot",
    "--cov-report=term-missing",
    "--cov-fail-under=65",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["bot"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/conftest.py",
    "bot/main.py",
    "bot/import_catalog.py",
    "bot/middlewares/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"